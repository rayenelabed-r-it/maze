[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazing-mazes"
version = "0.1.0"
description = "Génération et résolution de labyrinthes parfaits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pillow>=10.0"]

[project.scripts]
mazes = "mazes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks"]
